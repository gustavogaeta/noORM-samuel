<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<h1>front + backend + banco de dados</h1>
<p>Cada botão chama um método</p>

<hr>

<h2>GET - Listar alunos</h2>
<button id="btn-get">listar</button>
<div id="lista"></div>

<section>
<h2>POST - Cadastrar aluno</h2>
<input id="cad-nome" placeholder="nome"/>
<input id="cad-email" placeholder="email"/>
<input id="cad-senha" placeholder="senha"/>
<button id="btn-cadastrar">Cadastrar</button>
</section>

<hr>

<section>
    <h2>PATCH - Atualizar cadastros</h2>
    <input id="atualizar-nome" placeholder="nome"/>
    <input id="atualizar-email" placeholder="email"/>
    <input id="atualizar-senha" placeholder="senha"/>

    <button id="btn-atualizar">Atualizar</button>

</section>

<hr>

<section>
    <h2>DELETE - Apagar alunos</h2>
    <input id="deletar-id" placeholder="id">
    <button id="btn-apagar">Apagar</button> 
</section>

<script src="script.js"></script>

</body>
</html>
